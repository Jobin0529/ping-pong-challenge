server:
  port: 8080

spring:
  application:
    name: ping-service
  main:
    web-application-type: reactive
  data:
    mongodb:
      uri: mongodb://localhost:27017/pingpong
      database: pingpong

pong:
  service:
    url: http://localhost:8082
    endpoint: /api/pong

rate:
  limiter:
    lock:
      file: /tmp/ping-pong-rate.lock
    max:
      per:
        second: 2

rocketmq:
  enabled: true
  endpoints: localhost:8081
  namespace: ""
  consumer:
    group: ping-consumer-group
    topic: pong-audit

logging:
  level:
    root: INFO
    com.example.ping: DEBUG
    com.example.common: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ping-service-${server.port}.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
