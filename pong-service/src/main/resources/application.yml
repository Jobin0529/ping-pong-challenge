server:
  port: 8082

spring:
  application:
    name: pong-service
  main:
    web-application-type: reactive

rocketmq:
  enabled: true
  endpoints: localhost:8081
  namespace: ""
  producer:
    topic: pong-audit

logging:
  level:
    root: INFO
    com.example.pong: DEBUG
    com.example.common: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
